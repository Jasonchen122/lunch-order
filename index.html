.coinbar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(560px,calc(100% - 20px));display:grid;grid-template-columns:1.25fr 1fr;gap:6px;z-index:40;transition:transform .3s,opacity .3s;filter:drop-shadow(0 6px 12px rgba(80,50,0,.28))}

        document.querySelectorAll('.hole').forEach(function(h){h.classList.remove('up','hit')});var w=WMSG[0];WMSG.forEach(function(x){if(wScore>=x[0])w=x});
        $('wres').innerHTML='<div class="fortune"><b>'+wScore+' 分！</b><p>'+w[1]+'</p><small>'+w[2]+'<br>🐻 TOM 小笑話：'+rnd(JOKES)+'</small></div>';if(wScore>=12)burst($('cs'))}},1000);
    }).catch(function(e){toast(e.message,1)})};

// 輸入時把熊幣列藏起來，避免擋到
document.addEventListener('focusin',function(e){if(e.target.closest&&e.target.closest('#cartCard,#after,#peopleCard,#rs'))$('coinbar').classList.add('hidebar')});
document.addEventListener('focusout',function(){setTimeout(function(){var a=document.activeElement;if(!a||!a.closest||!a.closest('#cartCard,#after,#peopleCard'))$('coinbar').classList.remove('hidebar')},150)});

// ---------- 推薦新菜單 ----------
var recPics=[];
function shrinkImg(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
  var sc=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function openRec(){recPics=[];drawRec();$('rs').classList.add('open');$('rsBg').classList.add('open');document.body.style.overflow='hidden'}
function closeRec(){$('rs').classList.remove('open');$('rsBg').classList.remove('open');document.body.style.overflow=''}
$('rsBg').onclick=closeRec;
function drawRec(){
  $('rs').innerHTML='<div class="rs-h"><img src="img/joy_head.png" alt="JOY"><div><b>我要推薦新菜單</b><span>在外面看到好吃的？拍下菜單，JOY 幫你交給管理員</span></div><button class="rs-x" id="rsX" aria-label="關閉">✕</button></div>'+
   '<div class="rs-rw"><img src="img/coin-64.png" alt=""><span>送出 <b>+1 熊幣</b>（每天一次），被管理員採用再 <b>+1 熊幣</b>！</span></div>'+
   '<div class="rs-f"><label>你的分機 <span class="req">*</span></label><input id="rsExt" inputmode="numeric" placeholder="例如 226" value="'+esc(me.ext||'')+'"></div>'+
   '<div class="grid2 rs-f"><div><label>餐廳名稱（選填）</label><input id="rsShop" placeholder="例如 巷口牛肉麵"></div><div><label>電話（選填）</label><input id="rsPhone" inputmode="tel" placeholder="02-1234-5678"></div></div>'+
   '<label>菜單照片 <span class="req" style="color:#D93A30">*</span>（至少一張）</label>'+
   '<div class="rs-cam"><label><span class="e">📷</span>拍照<input type="file" accept="image/*" capture="environment" id="rsCam"></label><label><span class="e">🖼️</span>從相簿選<input type="file" accept="image/*" multiple id="rsAlb"></label></div>'+
   '<div class="rs-th" id="rsTh"></div><div class="rs-err" id="rsErr"></div>'+
   '<div class="rs-f"><label>一句話推薦（選填）</label><input id="rsNote" maxlength="80" placeholder="例如 排骨超大塊、可以外送"></div>'+
   '<button class="rs-send" id="rsSend">送出推薦</button><button class="ghost" id="rsNo" style="width:100%;margin-top:6px">先不要</button>';
  $('rsX').onclick=closeRec;$('rsNo').onclick=closeRec;
  function add(fs){[].slice.call(fs).forEach(function(f){if(recPics.length>=6)return toast('最多 6 張',1);shrinkImg(f).then(function(d){recPics.push(d);drawTh()}).catch(function(){toast('這張照片讀不到，換一張試試',1)})})}
  $('rsCam').onchange=function(){add(this.files);this.value=''};$('rsAlb').onchange=function(){add(this.files);this.value=''};
  $('rsSend').onclick=sendRec;drawTh();
}
function drawTh(){var t=$('rsTh');if(!t)return;t.innerHTML=recPics.map(function(p,i){return '<div><img src="'+p+'" alt=""><button data-x="'+i+'">✕</button></div>'}).join('');
  t.onclick=function(e){var b=e.target.closest('[data-x]');if(b){recPics.splice(+b.dataset.x,1);drawTh()}};if(recPics.length)$('rsErr').style.display='none'}
function recErr(m,el){var e=$('rsErr');e.textContent=m;e.style.display='block';if(el)el.focus();toast(m,1)}
function sendRec(){
  var ext=$('rsExt').value.trim();if(!ext)return recErr('請輸入你的分機，讓管理員知道是誰推薦的',$('rsExt'));
  if(!recPics.length)return recErr('請至少拍一張菜單照片');
  var b=$('rsSend'),urls=[],i=0;b.disabled=true;
  (function next(){
    if(i>=recPics.length){b.innerHTML='<span class="spin"></span> 送出中';
      return LunchAPI.call('saveRec',{ext:ext,name:me.ext===ext?(me.name||''):'',shop:$('rsShop').value.trim(),phone:$('rsPhone').value.trim(),note:$('rsNote').value.trim(),images:urls}).then(function(r){
        if(!me.ext){me.ext=ext;saveMe()}
        var nm=r.rec.shop||'這家店';
        $('rs').innerHTML='<div class="rs-done"><img src="img/joy.png" alt="JOY"><h3>謝謝你的推薦！</h3><p>JOY 已經把「'+esc(nm)+'」交給管理員<br>'+(r.bonus?'熊幣 +1，':'今天的推薦熊幣已經拿過囉，')+'被採用再送 +1 🎉</p><button class="primary" id="rsOk" style="width:100%">好的</button></div>';
        $('rsOk').onclick=closeRec;
        if(me.ext===ext){coinLabel='推薦熊幣';popMsg='謝謝你推薦新菜單';loadCoins(true)}
      }).catch(function(e){b.disabled=false;b.textContent='送出推薦';recErr(e.message)})}
    b.innerHTML='<span class="spin"></span> 上傳照片 '+(i+1)+' / '+recPics.length;
    LunchAPI.call('uploadRecImage',{ext:ext,data:recPics[i],mime:'image/jpeg'}).then(function(r){urls.push(r.url);i++;next()}).catch(function(e){b.disabled=false;b.textContent='送出推薦';recErr('照片上傳失敗：'+e.message)});
  })();
}
function checkAdopted(){if(!CM||!CM.adopted||!CM.adopted.length)return;var seen={};try{seen=JSON.parse(localStorage.getItem('recSeen')||'{}')}catch(e){}
  var n=CM.adopted.filter(function(a){return !seen[a.id]})[0];if(!n)return;seen[n.id]=1;try{localStorage.setItem('recSeen',JSON.stringify(seen))}catch(e){}
  var d=document.createElement('div');d.className='cpop';d.style.pointerEvents='auto';d.style.animation='none';d.innerHTML='<img src="img/joy_head.png" alt="" style="animation:none;border-radius:50%"><b style="color:#0F6E56">你推薦的菜單被採用了！</b><span>「'+esc(n.shop)+'」已經加進店家 DM<br>熊幣 +1 🎉</span><button class="primary" style="margin-top:10px;width:100%">太好了</button>';

  var ni=0;

      var w=bg.people.filter(function(p){return !p.picked})[0];if(!w)return toast('大家都領完了！',1);

      var tot=0;db.orders.forEach(function(o){if(o.groupId===x.id)tot+=+o.amount});
